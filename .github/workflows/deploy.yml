# Собирает приложение и публикует его на GitHub Pages при каждом изменении
# рабочей ветки. Ссылка на результат появляется во вкладке Actions.
name: Публикация прототипа

on:
  push:
    branches: [claude/eager-dirac-byivw7, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Без ключей проекта сборка получается демонстрационной: экраны
      # наполняются выдуманными данными, вход не работает, и внешне это
      # почти незаметно. Лучше не собрать вовсе, чем опубликовать такое.
      - name: Проверить ключи проекта
        run: |
          test -f .env || { echo "::error::Нет файла .env — сборка вышла бы демонстрационной"; exit 1; }
          grep -q '^VITE_SUPABASE_URL=https' .env \
            || { echo "::error::В .env нет адреса Supabase"; exit 1; }
          grep -q '^VITE_SUPABASE_PUBLISHABLE_KEY=sb_' .env \
            || { echo "::error::В .env нет публичного ключа Supabase"; exit 1; }

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
